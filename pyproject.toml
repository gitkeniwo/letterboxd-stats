[project]
name = "letterboxd-wrapped"
version = "0.2.0"
description = "Local-first Letterboxd data import, TMDB enrichment, and visualization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
]

[project.scripts]
letterboxd-wrapped = "letterboxd_stats.cli:main"
letterboxd-stats = "letterboxd_stats.cli:main"
init-db = "db.init_db:main"

[project.urls]
Homepage = "https://github.com/gitkeniwo/letterboxd-stats"
Repository = "https://github.com/gitkeniwo/letterboxd-stats"
Issues = "https://github.com/gitkeniwo/letterboxd-stats/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letterboxd_stats", "visualizations", "db"]

[dependency-groups]
dev = ["pytest>=8.0"]
